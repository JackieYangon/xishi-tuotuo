    <path fill="url(#light)" d="M0 0H1280V280H0Z" />
    <path fill="#fff8f3" opacity="0.23" d="M0 219C165 254 373 259 571 237S984 177 1280 252V280H0Z" />
  </g>
  <g fill="#fffaf7" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="640" y="48" font-size="14" letter-spacing="5" opacity="0.82">WEDDING PLANNING</text>
    <text x="643" y="149" font-size="80" font-weight="700" letter-spacing="6">XISHI TUOTUO</text>
    <text x="640" y="196" font-size="20" letter-spacing="1.5" opacity="0.9">Every detail, thoughtfully arranged.</text>
  </g>
