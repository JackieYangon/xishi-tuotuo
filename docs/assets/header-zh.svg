    <path fill="url(#light)" d="M0 0H1280V280H0Z" />
    <path fill="#fff8f3" opacity="0.23" d="M0 219C165 254 373 259 571 237S984 177 1280 252V280H0Z" />
  </g>
  <g fill="#fffaf7" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="640" y="48" font-size="14" letter-spacing="5" opacity="0.82">XISHI TUOTUO</text>
    <text x="648" y="151" font-size="100" font-weight="700" letter-spacing="16">喜事妥妥</text>
    <text x="640" y="196" font-size="20" letter-spacing="3" opacity="0.9">把喜事，一件件安排妥当</text>
  </g>
</svg>
