<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title description">
  <title id="title">喜事妥妥</title>
  <desc id="description">暖玫瑰红到蓝紫色的渐变横幅，白色喜事妥妥标题，底部轻柔波浪。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a65f6a" />
      <stop offset="0.5" stop-color="#866b84" />
      <stop offset="1" stop-color="#626da2" />
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6ee" stop-opacity="0.05" />
      <stop offset="1" stop-color="#fff6ee" stop-opacity="0" />
    </linearGradient>
    <clipPath id="wave-edge">
      <path d="M0 0H1280V254C1095 230 968 206 800 215C540 232 430 255 236 239C144 232 77 233 0 247Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#wave-edge)">
